[project]
name = "parksight-calgary-tower"
version = "0.1.0"
description = "A small Calgary curb map with manual Street View sign review"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "httpx>=0.27,<1",
  "python-dotenv>=1,<2",
  "pillow>=10,<13",
  "ultralytics>=8.3,<9",
  "openvino>=2026,<2027",
  "torch>=2.3",
  "torchvision>=0.18",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
